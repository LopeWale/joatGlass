<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #000000; }
    /* Borders must NOT change row height: a selection highlight that grows
       its row by 1px each side makes every row below it jog as the
       highlight moves — visible jitter on a head-mounted display. */
    * { box-sizing: border-box; }
    a { color: #7cfc98; } a:hover { color: #a8ffc2; }
    @keyframes joat-blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    /* Firmware brightness tiers (textColor 4..1). ONE tier per element,
       never nested — 16 green levels cannot render 0.44 and 0.45 apart. */
    .t4 { opacity: 1; }
    .t3 { opacity: 0.72; }
    .t2 { opacity: 0.5; }
    .t1 { opacity: 0.3; }
    .hud { width: 576px; height: 288px; background: #000000; color: #7cfc98;
           font-family: ui-monospace, 'SF Mono', Menlo, monospace;
           display: flex; flex-direction: column; overflow: hidden; }
    .status { height: 32px; display: flex; justify-content: space-between;
              align-items: center; padding: 0 16px; font-size: 15px; }
    .hint { height: 32px; display: flex; align-items: center;
            padding: 0 16px; font-size: 14px; }
    .body { flex-grow: 1; display: flex; flex-direction: column; }
  </style>
</helmet>
<div style="width: 576px; height: 288px; background: #000000; color: #7cfc98; font-family: ui-monospace, 'SF Mono', Menlo, monospace; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; box-sizing: border-box;">
  <div style="height: 32px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; font-size: 15px; opacity: 0.5; box-sizing: border-box;"><span>09:41</span><span>debate &#183; round 2/4 &#183; 0.78</span><span>bat 87%</span></div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; box-sizing: border-box; gap: 6px; padding: 8px 16px 0 16px;">
    <div style="opacity: 0.5; box-sizing: border-box; font-size: 15px;">&#187; CODEX &#183; proposer</div>
    <div style="opacity: 0.72; box-sizing: border-box; font-size: 17px; line-height: 24px;">Cache the STT model in memory and reuse the session across utterances.</div>
    <div style="opacity: 0.5; box-sizing: border-box; font-size: 15px; margin-top: 4px;">&#187; CLAUDE &#183; critic</div>
    <div style="opacity: 1; box-sizing: border-box; font-size: 17px; line-height: 24px;">
      <span>Agreed on caching, but the session must reset on audio gaps or</span>
      <span style="display: inline-block; width: 10px; height: 17px; background: #7cfc98; vertical-align: text-bottom; animation: joat-blink 1s step-start infinite;"></span>
    </div>
  </div>
  <div style="height: 32px; display: flex; align-items: center; padding: 0 16px; font-size: 14px; opacity: 0.3; box-sizing: border-box;"><span>right tap: stop &#183; left double-tap: menu</span></div>
</div>
</x-dc>
</body>
</html>
