[project]
name = "joat-g2"
version = "0.1.0"
description = "J.A.R.V.I.S. brain for the Even Realities G2 — Mac Studio side."
requires-python = ">=3.12"
dependencies = [
    "websockets>=13.0",
]

[project.optional-dependencies]
mlx = [
    "mlx-lm>=0.31",
]
nli = [
    # The fact-checking MiniCheck (Liyan06) — NOT the PyPI 'minicheck',
    # which is an unrelated formal-methods model checker.
    "minicheck @ git+https://github.com/Liyan06/MiniCheck.git@main",
    # transformers' device_map path needs this; MiniCheck doesn't declare it
    "accelerate>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/mac"]
include = ["joat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/mac"]
asyncio_mode = "auto"

[tool.mypy]
# RULES.md #3: typed end to end.
python_version = "3.12"
strict = true
mypy_path = "apps/mac"
packages = ["joat"]

[[tool.mypy.overrides]]
module = "websockets.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "minicheck.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nltk.*"
ignore_missing_imports = true
